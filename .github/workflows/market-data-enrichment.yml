name: market-data-enrichment

on:
  schedule:
    # After North American cards and after the upstream UFCStats mirror's
    # daily refresh. All collectors are bounded and incremental.
    - cron: "45 10 * * *"
  workflow_dispatch: {}

concurrency:
  group: market-data-v3-writer
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: market_data_v3/requirements.txt

      - name: Install isolated data dependencies
        run: pip install -r market_data_v3/requirements.txt

      - name: Stage the maintained UFCStats mirror
        run: |
          git clone --depth 1 https://github.com/Greco1899/scrape_ufc_stats.git "$RUNNER_TEMP/ufcstats"
          echo "UFCSTATS_SOURCE_REVISION=$(git -C "$RUNNER_TEMP/ufcstats" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Ingest the maintained UFCStats reference
        run: |
          python -m market_data_v3.src.cli ingest-reference \
            --source greco_ufcstats \
            --source-dir "$RUNNER_TEMP/ufcstats" \
            --source-revision "$UFCSTATS_SOURCE_REVISION"

      - name: Increment current official scorecard transcriptions
        id: scorecards
        continue-on-error: true
        run: |
          # A wider discovery window recovers after missed runs; only unknown
          # decisions plus the newest 12 known pages are downloaded.
          python -m market_data_v3.src.cli ingest-scorecards \
            --max-events 8 --pace-seconds 0.25 --refresh-known 12 \
            --workers 6 --requests-per-second 4

      - name: Advance the historical direct-verification queue
        id: scorecard_history
        continue-on-error: true
        run: |
          python -m market_data_v3.src.cli backfill-scorecards \
            --start-year 1995 --end-year 2024 --max-pages 100 \
            --workers 4 --requests-per-second 2 --retries 2
          python -m market_data_v3.src.cli reconcile-scorecards

      - name: Capture today's rankings and roster state
        id: snapshots
        continue-on-error: true
        run: |
          python -m market_data_v3.src.cli capture-snapshots

      - name: Contract tests and whole-store validation
        run: |
          python -m unittest discover -s market_data_v3/tests -p "test_*.py"
          python -m market_data_v3.src.cli validate
          python -m market_data_v3.src.cli build-catalog
          python -m market_data_v3.src.cli inventory

      - name: Persist only the isolated data platform
        run: |
          git config user.name "market-data-bot"
          git config user.email "actions@github.com"
          git add market_data_v3/store market_data_v3/manifests market_data_v3/reports
          if ! git diff --cached --quiet; then
            git commit -m "market-data: enrich ${UFCSTATS_SOURCE_REVISION:0:12}"
            OK=0
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && OK=1 && break
              echo "push attempt $attempt failed"; sleep 5
            done
            [ "$OK" -eq 1 ] || exit 1
          fi

      - name: Upload portable catalog and source manifests
        uses: actions/upload-artifact@v5
        with:
          name: market-data-enrichment-${{ github.run_id }}
          path: |
            market_data_v3/build/canonical.duckdb
            market_data_v3/manifests/reference_greco_ufcstats_latest.json
            market_data_v3/manifests/scorecards_mmadecisions_latest.json
            market_data_v3/manifests/snapshot_octagon_latest.json
            market_data_v3/reports/HEALTH_LATEST.md
            market_data_v3/reports/INVENTORY_LATEST.md
          retention-days: 30

      - name: Mark a degraded optional source after preserving healthy sources
        if: steps.scorecards.outcome == 'failure' || steps.scorecard_history.outcome == 'failure' || steps.snapshots.outcome == 'failure'
        run: |
          echo "scorecards=${{ steps.scorecards.outcome }} history=${{ steps.scorecard_history.outcome }} snapshots=${{ steps.snapshots.outcome }}"
          exit 1

      - name: Open a deduplicated incident on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEY="market-data-v3-enrichment-$(date -u +%Y-%m-%d)"
          if ! gh issue list --state open --search "${KEY} in:body" --json body | grep -q "$KEY"; then
            gh issue create \
              --title "DATA INCIDENT: market-data-v3 enrichment failed" \
              --body "The autonomous enrichment job failed. Inspect run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}.\n\nincident_key: ${KEY}"
          fi
