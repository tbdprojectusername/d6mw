name: market-data-reference-audit

on:
  schedule:
    # Independent quarterly-updated source checked weekly for revisions.
    - cron: "15 14 * * 1"
  workflow_dispatch: {}

concurrency:
  group: market-data-v3-writer
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: market_data_v3/requirements.txt

      - run: pip install -r market_data_v3/requirements.txt

      - name: Download the two bounded UFC-DataLab audit tables
        run: |
          mkdir -p "$RUNNER_TEMP/datalab/data/scorecards/OCR_parsed_scorecards" "$RUNNER_TEMP/datalab/data/stats"
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/komaksym/UFC-DataLab/main/data/scorecards/OCR_parsed_scorecards/SCORECARDS.csv \
            --output "$RUNNER_TEMP/datalab/data/scorecards/OCR_parsed_scorecards/SCORECARDS.csv"
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/komaksym/UFC-DataLab/main/data/stats/stats_raw.csv \
            --output "$RUNNER_TEMP/datalab/data/stats/stats_raw.csv"
          echo "DATALAB_SOURCE_REVISION=$(git ls-remote https://github.com/komaksym/UFC-DataLab.git refs/heads/main | cut -f1)" >> "$GITHUB_ENV"

      - name: Ingest the independent stats and scorecard audit source
        run: |
          python -m market_data_v3.src.cli ingest-reference \
            --source ufc_datalab \
            --source-dir "$RUNNER_TEMP/datalab" \
            --source-revision "$DATALAB_SOURCE_REVISION"
          python -m unittest discover -s market_data_v3/tests -p "test_*.py"
          python -m market_data_v3.src.cli validate
          python -m market_data_v3.src.cli build-catalog
          python -m market_data_v3.src.cli inventory

      - name: Persist only the isolated data platform
        run: |
          git config user.name "market-data-bot"
          git config user.email "actions@github.com"
          git add market_data_v3/store market_data_v3/manifests market_data_v3/reports
          if ! git diff --cached --quiet; then
            git commit -m "market-data: audit source ${DATALAB_SOURCE_REVISION:0:12}"
            OK=0
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && OK=1 && break
              echo "push attempt $attempt failed"; sleep 5
            done
            [ "$OK" -eq 1 ] || exit 1
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: market-data-reference-audit-${{ github.run_id }}
          path: |
            market_data_v3/build/canonical.duckdb
            market_data_v3/manifests/reference_ufc_datalab_latest.json
            market_data_v3/reports/HEALTH_LATEST.md
            market_data_v3/reports/INVENTORY_LATEST.md
          retention-days: 30

      - name: Open a deduplicated incident on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEY="market-data-v3-reference-$(date -u +%Y-%m-%d)"
          if ! gh issue list --state open --search "${KEY} in:body" --json body | grep -q "$KEY"; then
            gh issue create \
              --title "DATA INCIDENT: market-data-v3 reference audit failed" \
              --body "The independent reference-source job failed. Inspect run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}.\n\nincident_key: ${KEY}"
          fi
